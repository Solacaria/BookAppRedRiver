<section class="panel">
  <div class="panel-header">
    <span class="kicker">Formulär</span>
    <h2>{{ headline }}</h2>
  </div>

  @if (message) {
    <p class="form-message">{{ message }}</p>
  }

  <form class="book-form" (ngSubmit)="bookSave()" >
    <div class="form-row">
      <label>
        <span>Titel</span>
        <input class="form-control" type="text" placeholder="Skriv boktitel"
          name="title"
          [(ngModel)]="book.title" />
      </label>

      <label>
        <span>Författare</span>
        <input class="form-control" type="text" placeholder="Ange författare"
          name="author"
          [(ngModel)]="book.author" />
      </label>
    </div>

    <div class="two-col">
      <label>
        <span>Publiceringsår</span>
        <input class="form-control" type="text" 
          name="publishedDate"
          [(ngModel)]="book.publishedDate" />
      </label>
    </div>

    <div class="card-actions">
      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-floppy-disk"></i>
        Spara bok
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
        <i class="fa-solid fa-xmark"></i>
        Avbryt
      </button>
    </div>
  </form>
</section>
